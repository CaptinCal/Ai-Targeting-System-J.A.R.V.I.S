<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>JARVIS V6.6</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}

/* ================= HUD ================= */

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: #00ff88;
    text-shadow: 0 0 8px #00ff88;
}

/* ================= TOP ================= */

#system {
    position: absolute;
    top: 18px;
    left: 18px;

    font-size: 17px;
    font-weight: bold;
}

#version {
    position: absolute;
    top: 18px;
    right: 18px;

    font-size: 15px;
    font-weight: bold;
}

/* ================= TARGET STATUS ================= */

#targetStatus {
    position: absolute;

    left: 50%;
    top: 75%;

    transform: translateX(-50%);

    font-size: 15px;
    font-weight: bold;
    letter-spacing: 3px;

    white-space: nowrap;
}

/* ================= CENTER ================= */

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 45px;

    text-shadow:
        0 0 8px #00ff88,
        0 0 20px #00ff88;
}

/* ================= TARGET BOX ================= */

#targetBox {

    position: absolute;

    display: none;

    border: 3px solid #00ff88;

    box-shadow:
        0 0 8px #00ff88,
        0 0 20px #00ff88,
        inset 0 0 12px rgba(0,255,136,.2);

    transition:
        left .08s linear,
        top .08s linear,
        width .08s linear,
        height .08s linear;
}

/* ================= TARGET LABEL ================= */

#targetLabel {

    position: absolute;

    display: none;

    padding: 5px 8px;

    font-size: 11px;
    font-weight: bold;

    background: rgba(0,0,0,.75);

    border: 1px solid #00ff88;
}

/* ================= LOCKED ================= */

.locked #targetBox {

    border-color: red;

    box-shadow:
        0 0 8px red,
        0 0 22px red,
        inset 0 0 12px rgba(255,0,0,.25);
}

.locked #targetLabel {

    color: red;

    border-color: red;

    text-shadow: 0 0 8px red;
}

.locked #targetStatus {

    color: red;

    text-shadow:
        0 0 8px red,
        0 0 18px red;
}

/* ================= SKELETON ================= */

#skeletonCanvas {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;
}

/* ================= PANEL ================= */

#panel {

    position: absolute;

    left: 18px;
    bottom: 20px;

    width: 230px;

    padding: 14px;

    background: rgba(0,10,10,.65);

    border:
        1px solid rgba(0,255,136,.5);

    backdrop-filter: blur(5px);
}

.panelTitle {

    font-size: 10px;

    letter-spacing: 2px;

    opacity: .7;

    margin-bottom: 8px;
}

.value {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 10px;
}

.bar {

    width: 100%;

    height: 5px;

    background: rgba(255,255,255,.15);

    margin-bottom: 10px;
}

.fill {

    width: 0%;

    height: 100%;

    background: #00ff88;

    box-shadow: 0 0 8px #00ff88;
}

/* ================= JARVIS PANEL ================= */

#jarvisPanel {

    position: absolute;

    right: 18px;
    bottom: 80px;

    width: 250px;

    padding: 14px;

    background: rgba(0,10,10,.65);

    border:
        1px solid rgba(0,255,136,.5);

    backdrop-filter: blur(5px);
}

#jarvisTitle {

    font-size: 10px;

    letter-spacing: 2px;

    opacity: .7;

    margin-bottom: 8px;
}

#jarvisMessage {

    font-size: 12px;

    font-weight: bold;

    line-height: 1.5;
}

/* ================= BUTTONS ================= */

button {

    position: fixed;

    z-index: 20;

    border: none;

    border-radius: 9px;

    padding: 14px 20px;

    font-size: 13px;

    font-weight: bold;

    background: #00ff88;

    color: black;

    box-shadow:
        0 0 15px rgba(0,255,136,.5);
}

#start {

    left: 50%;
    top: 85%;

    transform: translateX(-50%);
}

#voiceButton {

    right: 18px;
    bottom: 20px;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

    #panel {

        left: 8px;
        bottom: 15px;

        width: 185px;

        padding: 10px;
    }

    #jarvisPanel {

        right: 8px;
        bottom: 78px;

        width: 185px;

        padding: 10px;
    }

    #system {
        left: 10px;
        top: 12px;
    }

    #version {
        right: 10px;
        top: 12px;
    }

}

</style>
</head>

<body>

<!-- CAMERA -->

<video
    id="camera"
    autoplay
    playsinline>
</video>

<!-- SKELETON -->

<canvas id="skeletonCanvas"></canvas>

<!-- HUD -->

<div id="hud">

    <div id="system">
        SYSTEM: OFFLINE
    </div>

    <div id="version">
        JARVIS V6.6
    </div>

    <div id="crosshair">
        +
    </div>

    <div id="targetBox"></div>

    <div id="targetLabel">
        HUMAN
    </div>

    <div id="targetStatus">
        SEARCHING
    </div>

    <!-- INFORMATION PANEL -->

    <div id="panel">

        <div class="panelTitle">
            VISION SYSTEM
        </div>

        <div id="aiClass" class="value">
            OFFLINE
        </div>

        <div class="panelTitle">
            CONFIDENCE
        </div>

        <div id="confidenceText" class="value">
            0%
        </div>

        <div class="bar">
            <div id="confidenceBar" class="fill"></div>
        </div>

        <div class="panelTitle">
            STABILITY
        </div>

        <div id="stabilityText" class="value">
            0 / 8
        </div>

        <div class="bar">
            <div id="stabilityBar" class="fill"></div>
        </div>

    </div>

    <!-- JARVIS -->

    <div id="jarvisPanel">

        <div id="jarvisTitle">
            JARVIS // VOICE ASSISTANT
        </div>

        <div id="jarvisMessage">
            Voice system ready.
        </div>

    </div>

</div>

<button id="start">
    START CAMERA
</button>

<button id="voiceButton">
    🎙 JARVIS OFF
</button>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script>

/* =========================================================
   JARVIS V6.6
   HUMAN DETECTION + SKELETON HUD
   ========================================================= */


/* ================= ELEMENTS ================= */

const camera =
    document.getElementById("camera");

const start =
    document.getElementById("start");

const voiceButton =
    document.getElementById("voiceButton");

const system =
    document.getElementById("system");

const aiClass =
    document.getElementById("aiClass");

const confidenceText =
    document.getElementById("confidenceText");

const confidenceBar =
    document.getElementById("confidenceBar");

const stabilityText =
    document.getElementById("stabilityText");

const stabilityBar =
    document.getElementById("stabilityBar");

const targetStatus =
    document.getElementById("targetStatus");

const targetBox =
    document.getElementById("targetBox");

const targetLabel =
    document.getElementById("targetLabel");

const jarvisMessage =
    document.getElementById("jarvisMessage");

const skeletonCanvas =
    document.getElementById("skeletonCanvas");

const ctx =
    skeletonCanvas.getContext("2d");


/* ================= SETTINGS ================= */

const REQUIRED_STABILITY = 8;

const REQUIRED_CONFIDENCE = 100;


/* ================= VARIABLES ================= */

let stability = 0;

let locked = false;

let cameraRunning = false;

let listening = false;


/* =========================================================
   JARVIS SPEECH
   ========================================================= */

let speechUnlocked = false;

let cachedVoice = null;

function loadVoice() {

    const voices =
        speechSynthesis.getVoices();

    if (!voices || voices.length === 0)
        return;

    cachedVoice =
        voices.find(function(v) {
            return v.lang === "en-US";
        }) ||
        voices.find(function(v) {
            return v.lang &&
                v.lang.startsWith("en");
        }) ||
        voices[0];

}

if ("speechSynthesis" in window) {

    loadVoice();

    speechSynthesis.onvoiceschanged =
        loadVoice;

}

/*
   Mobile browsers (especially iOS Safari)
   only allow speechSynthesis to start
   when it is triggered directly inside a
   user tap/click. Call this once, at the
   very start of a button's onclick handler
   (before any "await"), to unlock audio
   for every jarvisSpeak() call afterward.
*/

function unlockSpeech() {

    if (
        speechUnlocked ||
        !("speechSynthesis" in window)
    ) {
        return;
    }

    const primer =
        new SpeechSynthesisUtterance(" ");

    primer.volume = 0;

    speechSynthesis.speak(primer);

    speechUnlocked = true;

}

function jarvisSpeak(text) {

    jarvisMessage.textContent = text;

    if (!("speechSynthesis" in window)) {

        jarvisMessage.textContent =
            "TTS NOT AVAILABLE";

        return;
    }

    speechSynthesis.cancel();

    speechSynthesis.resume();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = 0.80;

    voice.pitch = 0.90;

    voice.volume = 1.0;

    if (cachedVoice) {

        voice.voice = cachedVoice;

    }

    voice.onerror = function(event) {

        console.log(
            "JARVIS VOICE ERROR:",
            event.error
        );

    };

    /*
       Some mobile browsers need a beat after
       cancel()/resume() before speak() will
       actually produce sound.
    */

    setTimeout(function() {

        speechSynthesis.speak(voice);

    }, 50);

}


/* =========================================================
   CAMERA
   ========================================================= */

start.onclick = async function() {

    /*
       Must run synchronously inside the tap,
       before any "await", or mobile browsers
       will block all speech for this session.
    */

    unlockSpeech();

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });


        camera.srcObject = stream;

        cameraRunning = true;

        start.style.display = "none";

        system.textContent =
            "SYSTEM: CAMERA ONLINE";

        aiClass.textContent =
            "INITIALIZING";

        jarvisSpeak(
            "Vision system online."
        );


        resizeCanvas();


        setTimeout(() => {

            startPoseDetection();

        }, 500);


    } catch(error) {

        system.textContent =
            "SYSTEM: CAMERA ERROR";

        jarvisMessage.textContent =
            "Camera access failed.";

        console.log(error);

    }

};


/* =========================================================
   CANVAS
   ========================================================= */

function resizeCanvas() {

    skeletonCanvas.width =
        window.innerWidth;

    skeletonCanvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   MEDIAPIPE POSE
   ========================================================= */

let pose;

function startPoseDetection() {

    pose = new Pose({

        locateFile: function(file) {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

        }

    });


    pose.setOptions({

        modelComplexity: 1,

        smoothLandmarks: true,

        enableSegmentation: false,

        smoothSegmentation: false,

        minDetectionConfidence: .60,

        minTrackingConfidence: .60

    });


    pose.onResults(
        onPoseResults
    );


    sendFrame();

}


/* =========================================================
   SEND CAMERA FRAME
   ========================================================= */

async function sendFrame() {

    if (!cameraRunning)
        return;

    if (
        camera.readyState >=
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        await pose.send({
            image: camera
        });

    }

    requestAnimationFrame(
        sendFrame
    );

}


/* =========================================================
   POSE RESULTS
   ========================================================= */

function onPoseResults(results) {

    ctx.clearRect(
        0,
        0,
        skeletonCanvas.width,
        skeletonCanvas.height
    );


    if (
        !results.poseLandmarks
    ) {

        stability = 0;

        locked = false;

        document.body.classList.remove(
            "locked"
        );

        targetBox.style.display =
            "none";

        targetLabel.style.display =
            "none";

        targetStatus.textContent =
            "SEARCHING";

        aiClass.textContent =
            "NO HUMAN";

        confidenceText.textContent =
            "0%";

        confidenceBar.style.width =
            "0%";

        stabilityText.textContent =
            "0 / 8";

        stabilityBar.style.width =
            "0%";

        return;
    }


    /* ================= HUMAN FOUND ================= */

    let visiblePoints = 0;

    for (
        let i = 0;
        i < results.poseLandmarks.length;
        i++
    ) {

        const point =
            results.poseLandmarks[i];

        if (
            point.visibility &&
            point.visibility > .5
        ) {

            visiblePoints++;

        }

    }


    /*
       Rough confidence estimate based
       on visible body landmarks.
    */

    let confidence =
        Math.round(
            (visiblePoints /
            results.poseLandmarks.length) *
            100
        );


    confidence =
        Math.max(
            0,
            Math.min(
                100,
                confidence
            )
        );


    aiClass.textContent =
        "HUMAN DETECTED";


    confidenceText.textContent =
        confidence + "%";


    confidenceBar.style.width =
        confidence + "%";


    /* ================= STABILITY ================= */

    if (confidence >= 80) {

        stability++;

    } else {

        stability = 0;

    }


    stability =
        Math.min(
            stability,
            REQUIRED_STABILITY
        );


    stabilityText.textContent =
        stability + " / 8";


    stabilityBar.style.width =
        (stability / 8 * 100) + "%";


    /* ================= LOCK ================= */

    if (
        stability >= REQUIRED_STABILITY &&
        confidence >= REQUIRED_CONFIDENCE
    ) {

        if (!locked) {

            locked = true;

            document.body.classList.add(
                "locked"
            );

            targetStatus.textContent =
                "TARGET LOCKED";

            targetLabel.textContent =
                "TARGET LOCKED";

            jarvisSpeak(
                "Target locked."
            );

        }

    } else {

        if (locked) {

            locked = false;

            document.body.classList.remove(
                "locked"
            );

            jarvisSpeak(
                "Target lock lost."
            );

        }

        targetStatus.textContent =
            "HUMAN DETECTED";

        targetLabel.textContent =
            "HUMAN";

    }


    /* ================= BOX ================= */

    drawTargetBox(
        results.poseLandmarks
    );


    /* ================= SKELETON ================= */

    drawSkeleton(
        results.poseLandmarks
    );

}


/* =========================================================
   TARGET BOX
   ========================================================= */

function drawTargetBox(landmarks) {

    let minX = 1;

    let minY = 1;

    let maxX = 0;

    let maxY = 0;


    for (
        let i = 0;
        i < landmarks.length;
        i++
    ) {

        const p =
            landmarks[i];

        if (
            p.visibility &&
            p.visibility > .5
        ) {

            minX =
                Math.min(
                    minX,
                    p.x
                );

            minY =
                Math.min(
                    minY,
                    p.y
                );

            maxX =
                Math.max(
                    maxX,
                    p.x
                );

            maxY =
                Math.max(
                    maxY,
                    p.y
                );

        }

    }


    const padding = .04;


    minX =
        Math.max(
            0,
            minX - padding
        );

    minY =
        Math.max(
            0,
            minY - padding
        );

    maxX =
        Math.min(
            1,
            maxX + padding
        );

    maxY =
        Math.min(
            1,
            maxY + padding
        );


    const left =
        minX *
        window.innerWidth;

    const top =
        minY *
        window.innerHeight;

    const width =
        (maxX - minX) *
        window.innerWidth;

    const height =
        (maxY - minY) *
        window.innerHeight;


    targetBox.style.display =
        "block";

    targetBox.style.left =
        left + "px";

    targetBox.style.top =
        top + "px";

    targetBox.style.width =
        width + "px";

    targetBox.style.height =
        height + "px";


    targetLabel.style.display =
        "block";

    targetLabel.style.left =
        left + "px";

    targetLabel.style.top =
        Math.max(
            5,
            top - 25
        ) + "px";

}


/* =========================================================
   SKELETON
   ========================================================= */

const connections = [

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28],

    [27,29],
    [29,31],

    [28,30],
    [30,32]

];


function drawSkeleton(landmarks) {

    ctx.lineWidth = 3;


    if (locked) {

        ctx.strokeStyle =
            "red";

        ctx.shadowColor =
            "red";

    } else {

        ctx.strokeStyle =
            "#00ff88";

        ctx.shadowColor =
            "#00ff88";

    }


    ctx.shadowBlur = 10;


    for (
        let i = 0;
        i < connections.length;
        i++
    ) {

        const a =
            landmarks[
                connections[i][0]
            ];

        const b =
            landmarks[
                connections[i][1]
            ];


        if (
            !a ||
            !b ||
            a.visibility < .5 ||
            b.visibility < .5
        ) {

            continue;

        }


        ctx.beginPath();


        ctx.moveTo(

            a.x *
            skeletonCanvas.width,

            a.y *
            skeletonCanvas.height

        );


        ctx.lineTo(

            b.x *
            skeletonCanvas.width,

            b.y *
            skeletonCanvas.height

        );


        ctx.stroke();

    }


    /* ================= JOINTS ================= */

    for (
        let i = 0;
        i < landmarks.length;
        i++
    ) {

        const p =
            landmarks[i];


        if (
            !p.visibility ||
            p.visibility < .5
        ) {

            continue;

        }


        ctx.beginPath();


        ctx.arc(

            p.x *
            skeletonCanvas.width,

            p.y *
            skeletonCanvas.height,

            4,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            locked
            ? "red"
            : "#00ff88";


        ctx.shadowBlur = 10;

        ctx.fill();

    }


    ctx.shadowBlur = 0;

}


/* =========================================================
   VOICE COMMANDS
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            listening = true;

            voiceButton.textContent =
                "🎙 JARVIS ON";

            jarvisMessage.textContent =
                "Listening. I'm ready.";

        };


    recognition.onend =
        function() {

            if (listening) {

                try {

                    recognition.start();

                } catch(error) {

                    console.log(error);

                }

            }

        };


    recognition.onresult =
        function(event) {

            const result =
                event.results[
                    event.results.length - 1
                ];


            if (!result.isFinal)
                return;


            let command =
                result[0]
                .transcript
                .toLowerCase()
                .trim();


            console.log(
                "JARVIS HEARD:",
                command
            );


            if (
                !command.includes(
                    "jarvis"
                )
            ) {

                return;

            }


            command =
                command.replace(
                    /\bjarvis\b/g,
                    ""
                )
                .trim();


            /* ================= COMMANDS ================= */


            if (!command) {

                jarvisSpeak(
                    "Yes?"
                );

                return;

            }


            if (
                command.includes(
                    "status"
                ) ||
                command.includes(
                    "system report"
                )
            ) {

                jarvisSpeak(

                    "System report. " +

                    "Camera online. " +

                    "Human vision active. " +

                    "Stability is " +

                    stability +

                    " out of 8."

                );

                return;

            }


            if (
                command.includes(
                    "identify"
                ) ||
                command.includes(
                    "target"
                )
            ) {

                if (locked) {

                    jarvisSpeak(
                        "Human target locked."
                    );

                } else {

                    jarvisSpeak(
                        "No locked target."
                    );

                }

                return;

            }


            if (
                command.includes(
                    "scan"
                ) ||
                command.includes(
                    "search"
                )
            ) {

                jarvisSpeak(
                    "Human scan active."
                );

                return;

            }


            if (
                command.includes(
                    "lock on"
                ) ||
                command.includes(
                    "lock onto"
                )
            ) {

                if (locked) {

                    jarvisSpeak(
                        "Target is already locked."
                    );

                } else {

                    jarvisSpeak(
                        "I do not have a confirmed lock."
                    );

                }

                return;

            }


            if (
                command.includes(
                    "hello"
                ) ||
                command.includes(
                    "hi"
                ) ||
                command.includes(
                    "hey"
                )
            ) {

                jarvisSpeak(
                    "Good to hear from you. Systems are standing by."
                );

                return;

            }


            if (
                command.includes(
                    "how are you"
                )
            ) {

                jarvisSpeak(
                    "I'm operating normally. All primary systems are online."
                );

                return;

            }


            if (
                command.includes(
                    "who are you"
                ) ||
                command.includes(
                    "what are you"
                )
            ) {

                jarvisSpeak(
                    "I'm your JARVIS style voice assistant, connected to the vision HUD."
                );

                return;

            }


            if (
                command.includes(
                    "ready"
                )
            ) {

                jarvisSpeak(
                    "Ready and standing by."
                );

                return;

            }


            if (
                command.includes(
                    "mute"
                ) ||
                command.includes(
                    "stop talking"
                ) ||
                command.includes(
                    "be quiet"
                )
            ) {

                speechSynthesis.cancel();

                jarvisMessage.textContent =
                    "Voice output muted.";

                return;

            }


            if (
                command.includes(
                    "help"
                ) ||
                command.includes(
                    "commands"
                )
            ) {

                jarvisSpeak(
                    "Available commands include status, identify target, scan, lock on, mute, and help."
                );

                return;

            }


            jarvisSpeak(
                "I'm listening. Say help for my available commands."
            );

        };

}


/* =========================================================
   VOICE BUTTON
   ========================================================= */

voiceButton.onclick =
    function() {

        unlockSpeech();

        if (!recognition) {

            jarvisSpeak(
                "Voice recognition is not supported by this browser."
            );

            return;

        }


        if (!listening) {

            try {

                recognition.start();

            } catch(error) {

                console.log(error);

            }

        } else {

            listening = false;

            recognition.stop();

            voiceButton.textContent =
                "🎙 JARVIS OFF";

            jarvisMessage.textContent =
                "Voice system offline.";

        }

    };

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1">

<title>AI HUD V6.5 + JARVIS</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020607;
    font-family: Arial, Helvetica, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: #00ffb3;
    text-shadow: 0 0 8px rgba(0,255,179,.8);
}

/* TOP */

#topLeft {
    position: absolute;
    top: 18px;
    left: 18px;
}

.title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
}

.subtitle {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 2px;
}

#topRight {
    position: absolute;
    top: 18px;
    right: 18px;
    text-align: right;
}

.version {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}

.online {
    margin-top: 6px;
    font-size: 10px;
}

/* SCAN */

#scanLine {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(0,255,179,.25);
    animation: scan 3.5s linear infinite;
}

/* CENTER TARGET */

#centerHUD {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 160px;
    height: 160px;
    transform: translate(-50%, -50%);
}

.ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,255,179,.5);
    border-top-color: transparent;
    border-bottom-color: transparent;
    border-radius: 50%;
    animation: rotate 5s linear infinite;
}

.ring2 {
    position: absolute;
    inset: 18px;
    border: 1px dashed rgba(0,255,179,.45);
    border-radius: 50%;
    animation: rotateReverse 8s linear infinite;
}

.crossHorizontal {
    position: absolute;
    width: 100px;
    height: 1px;
    left: 30px;
    top: 80px;
    background: #00ffb3;
}

.crossVertical {
    position: absolute;
    width: 1px;
    height: 100px;
    left: 80px;
    top: 30px;
    background: #00ffb3;
}

.centerDot {
    position: absolute;
    width: 7px;
    height: 7px;
    left: 77px;
    top: 77px;
    border-radius: 50%;
    background: #00ffb3;
    box-shadow: 0 0 15px #00ffb3;
}

/* TARGET BOX */

#targetBox {
    position: absolute;
    display: none;
    border: 3px solid #00ff88;
    box-shadow:
        0 0 8px #00ff88,
        inset 0 0 8px rgba(0,255,136,.25);
}

#targetLabel {
    position: absolute;
    display: none;
    padding: 4px 7px;
    background: rgba(0,15,18,.85);
    border: 1px solid #00ff88;
    color: #00ff88;
    font-size: 10px;
    font-weight: bold;
}

/* TARGET STATUS */

#targetStatus {
    position: absolute;
    left: 50%;
    top: calc(50% + 105px);
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
}

/* SYSTEM PANEL */

#infoPanel {
    position: absolute;
    left: 18px;
    bottom: 25px;
    min-width: 220px;
    padding: 14px 17px;
    background: rgba(0,15,18,.65);
    border: 1px solid rgba(0,255,179,.4);
    backdrop-filter: blur(6px);
}

.label {
    font-size: 9px;
    letter-spacing: 2px;
    opacity: .7;
}

.value {
    font-size: 16px;
    font-weight: bold;
    margin-top: 3px;
    margin-bottom: 9px;
}

.bar {
    width: 180px;
    height: 5px;
    background: rgba(255,255,255,.12);
    margin-bottom: 11px;
}

.fill {
    width: 0%;
    height: 100%;
    background: #00ffb3;
    box-shadow: 0 0 8px #00ffb3;
    transition: width .15s;
}

/* JARVIS PANEL */

#jarvisPanel {
    position: absolute;
    right: 18px;
    bottom: 105px;
    width: 255px;
    padding: 14px 16px;
    background: rgba(0,15,18,.65);
    border: 1px solid rgba(0,255,179,.4);
    backdrop-filter: blur(6px);
}

.jarvisTitle {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .7;
    margin-bottom: 7px;
}

#jarvisMessage {
    font-size: 12px;
    font-weight: bold;
    line-height: 1.5;
}

/* BUTTONS */

button {
    position: fixed;
    border: none;
    border-radius: 9px;
    background: #00ffb3;
    color: #00110d;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(0,255,179,.4);
    z-index: 20;
}

#start {
    left: 50%;
    top: 85%;
    transform: translateX(-50%);
    padding: 14px 23px;
    font-size: 13px;
}

#voiceButton {
    right: 18px;
    bottom: 25px;
    padding: 14px 18px;
    font-size: 12px;
}
/* ANIMATIONS */

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes scan {
    from { top: 0%; }
    to { top: 100%; }
}

/* PHONE */

@media(max-width:600px) {

    .title {
        font-size: 18px;
    }

    .subtitle {
        font-size: 9px;
    }

    #infoPanel {
        left: 10px;
        bottom: 20px;
        min-width: 190px;
        padding: 11px 13px;
    }

    .bar {
        width: 150px;
    }

    #jarvisPanel {
        right: 10px;
        bottom: 110px;
        width: 190px;
        padding: 11px 13px;
    }

    #voiceButton {
        right: 10px;
        bottom: 18px;
    }
    #targetStatus {
        top: calc(50% + 90px);
        font-size: 11px;
    }
}

</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="hud">

    <div id="scanLine"></div>

    <div id="topLeft">
        <div class="title">AI HUD</div>
        <div class="subtitle">
            VISION SYSTEM // JARVIS ONLINE
        </div>
    </div>

    <div id="topRight">
        <div class="version">
            V6.5 + JARVIS
        </div>

        <div class="online">
            ● SYSTEM READY
        </div>
    </div>

    <div id="centerHUD">
        <div class="ring"></div>
        <div class="ring2"></div>
        <div class="crossHorizontal"></div>
        <div class="crossVertical"></div>
        <div class="centerDot"></div>
    </div>

    <div id="targetBox"></div>

    <div id="targetLabel">
        TEST-TARGET
    </div>

    <div id="targetStatus">
        SEARCHING...
    </div>

    <div id="infoPanel">

        <div class="label">SYSTEM</div>

        <div id="system" class="value">
            CAMERA OFFLINE
        </div>

        <div class="label">AI CLASS</div>

        <div id="ai" class="value">
            OFFLINE
        </div>

        <div class="label">CONFIDENCE</div>

        <div id="confidenceText" class="value">
            0%
        </div>

        <div class="bar">
            <div id="confidenceBar" class="fill"></div>
        </div>

        <div class="label">STABILITY</div>

        <div id="stabilityText" class="value">
            0 / 8
        </div>

        <div class="bar">
            <div id="stabilityBar" class="fill"></div>
        </div>

    </div>

    <div id="jarvisPanel">

        <div class="jarvisTitle">
            JARVIS // VOICE ASSISTANT
        </div>

        <div id="jarvisMessage">
            Voice system ready.
        </div>

    </div>

</div>

<button id="start">
    START CAMERA
</button>
<button id="voiceButton">
    🎙 JARVIS OFF
</button>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>


<script>

/* ==========================================
   V6.5 SETTINGS
========================================== */

const MODEL_URL =
"https://teachablemachine.withgoogle.com/models/N_KaEwHEe/";

const TARGET_NAME =
"TEST-TARGET";

const REQUIRED_CONFIDENCE =
90;

const REQUIRED_FRAMES =
8;


/* ==========================================
   ELEMENTS
========================================== */

const camera =
document.getElementById("camera");

const start =
document.getElementById("start");

const voiceButton =
document.getElementById("voiceButton");
const system =
document.getElementById("system");

const ai =
document.getElementById("ai");

const confidenceText =
document.getElementById("confidenceText");

const confidenceBar =
document.getElementById("confidenceBar");

const stabilityText =
document.getElementById("stabilityText");

const stabilityBar =
document.getElementById("stabilityBar");

const targetStatus =
document.getElementById("targetStatus");

const targetBox =
document.getElementById("targetBox");

const targetLabel =
document.getElementById("targetLabel");

const jarvisMessage =
document.getElementById("jarvisMessage");


/* ==========================================
   VARIABLES
========================================== */

let model = null;

let stableFrames = 0;

let targetConfirmed = false;

let lastTargetConfirmed = false;

let voices = [];

let jarvisVoice = null;

let listening = false;


/* ==========================================
   VOICE SYSTEM
========================================== */

function loadVoices() {

    voices =
        speechSynthesis.getVoices();

    /*
       Prefer Daniel / British English.
    */

    jarvisVoice =
        voices.find(v =>
            v.name
            .toLowerCase()
            .includes("daniel") &&
            v.lang
            .toLowerCase()
            .includes("gb")
        );

    /*
       British fallback.
    */

    if (!jarvisVoice) {

        jarvisVoice =
            voices.find(v =>
                v.lang
                .toLowerCase()
                .startsWith("en-gb")
            );

    }

    /*
       English fallback.
    */

    if (!jarvisVoice) {

        jarvisVoice =
            voices.find(v =>
                v.lang
                .toLowerCase()
                .startsWith("en")
            );

    }
}


if ("speechSynthesis" in window) {

    loadVoices();

    speechSynthesis.onvoiceschanged =
        loadVoices;
}


/* ==========================================
   JARVIS SPEAK
========================================== */

/*
   recognitionPausedForSpeech tracks whether WE
   intentionally paused listening so JARVIS can
   talk. On iOS, having the mic actively listening
   and trying to play speech audio at the same time
   causes the audio to be silently muted. So: pause
   listening right before speaking, resume right
   after.
*/
let recognitionPausedForSpeech = false;

function jarvisSpeak(text) {

    jarvisMessage.textContent =
        text;

    if (!("speechSynthesis" in window)) {

        jarvisMessage.textContent =
            "TTS NOT SUPPORTED";

        return;
    }

    if (
        recognition &&
        listening
    ) {

        recognitionPausedForSpeech =
            true;

        try {
            recognition.stop();
        }

        catch(error) {
            console.log(error);
        }
    }

    speechSynthesis.cancel();

    loadVoices();

    /*
       iOS Safari silently drops speak() if it's
       called in the same tick right after cancel().
       A tiny delay fixes it. Harmless on other
       browsers.
    */

    setTimeout(function() {

        const msg =
            new SpeechSynthesisUtterance(text);

        currentUtterance =
            msg;

        msg.lang =
            "en-GB";

        if (jarvisVoice) {
            msg.voice =
                jarvisVoice;
        }

        msg.rate =
            0.82;

        msg.pitch =
            0.82;

        msg.volume =
            1.0;

        function resumeListening() {

            if (
                recognitionPausedForSpeech &&
                listening
            ) {

                recognitionPausedForSpeech =
                    false;

                try {
                    recognition.start();
                }

                catch(error) {
                    console.log(error);
                }
            }
        }

        msg.onerror =
            function(event) {

                console.log(
                    "JARVIS TTS ERROR:",
                    event.error
                );

                jarvisMessage.textContent =
                    "VOICE ERROR: " +
                    event.error;

                resumeListening();
            };

        msg.onend =
            resumeListening;

        speechSynthesis.speak(msg);

    }, 60);
}

/* ==========================================
   SPEECH UNLOCK
   (Chrome/Safari require speechSynthesis to
   fire synchronously inside a real click,
   BEFORE any "await". Calling this first
   thing inside the click handlers "unlocks"
   audio for the rest of the session so later
   async jarvisSpeak() calls actually make sound.)
========================================== */

function primeSpeech() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    loadVoices();

    const unlock =
        new SpeechSynthesisUtterance(" ");

    unlock.volume = 0;

    speechSynthesis.speak(unlock);
}

/* ==========================================
   CAMERA
========================================== */

start.onclick =
async function() {

    primeSpeech();

    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {
                    facingMode:
                    "environment"
                },

                audio: false

            });

        camera.srcObject =
            stream;

        system.textContent =
            "CAMERA ONLINE";

        start.style.display =
            "none";

        jarvisSpeak(
            "Vision system online."
        );

        loadModel();

    }

    catch(error) {

        system.textContent =
            "CAMERA ERROR";

        jarvisMessage.textContent =
            "Camera initialization failed.";

        console.log(error);

    }

};


/* ==========================================
   AI MODEL
========================================== */

async function loadModel() {

    try {

        model =
            await tmImage.load(

                MODEL_URL +
                "model.json",

                MODEL_URL +
                "metadata.json"

            );

        ai.textContent =
            "ACTIVE";

        jarvisSpeak(
            "All primary systems are operational."
        );

        predict();

        detectTargetBox();

    }

    catch(error) {

        ai.textContent =
            "LOAD ERROR";

        jarvisMessage.textContent =
            "Vision model failed to load.";

        console.log(error);

    }

}


/* ==========================================
   TARGET BOX
========================================== */

const boxCanvas =
document.createElement("canvas");

boxCanvas.width =
160;

boxCanvas.height =
120;

const boxCtx =
boxCanvas.getContext("2d");


function detectTargetBox() {

    if (
        camera.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        requestAnimationFrame(
            detectTargetBox
        );

        return;
    }

    boxCtx.drawImage(
        camera,
        0,
        0,
        160,
        120
    );

    const image =
        boxCtx.getImageData(
            0,
            0,
            160,
            120
        );

    let minX = 160;
    let minY = 120;
    let maxX = 0;
    let maxY = 0;

    let found = false;

    for (
        let y = 0;
        y < 120;
        y++
    ) {

        for (
            let x = 0;
            x < 160;
            x++
        ) {

            const index =
                (y * 160 + x) * 4;

            const r =
                image.data[index];

            const g =
                image.data[index + 1];

            const b =
                image.data[index + 2];

            if (
                g > 130 &&
                g > r * 1.3 &&
                g > b * 1.2
            ) {

                found = true;

                minX =
                    Math.min(minX, x);

                minY =
                    Math.min(minY, y);

                maxX =
                    Math.max(maxX, x);

                maxY =
                    Math.max(maxY, y);
            }
        }
    }

    if (found) {

        const scaleX =
            window.innerWidth / 160;

        const scaleY =
            window.innerHeight / 120;

        const left =
            minX * scaleX;

        const top =
            minY * scaleY;

        const width =
            (maxX - minX) * scaleX;

        const height =
            (maxY - minY) * scaleY;

        if (
            width > 8 &&
            height > 8
        ) {

            targetBox.style.display =
                "block";

            targetBox.style.left =
                left + "px";

            targetBox.style.top =
                top + "px";

            targetBox.style.width =
                width + "px";

            targetBox.style.height =
                height + "px";

            targetLabel.style.display =
                "block";

            targetLabel.style.left =
                left + "px";

            targetLabel.style.top =
                Math.max(5, top - 23) +
                "px";
        }

    }

    else {

        targetBox.style.display =
            "none";

        targetLabel.style.display =
            "none";
    }

    requestAnimationFrame(
        detectTargetBox
    );
}


/* ==========================================
   AI PREDICTION
========================================== */

async function predict() {

    if (!model) {

        requestAnimationFrame(
            predict
        );

        return;
    }

    try {

        const predictions =
            await model.predict(camera);

        predictions.sort(
            (a,b) =>
            b.probability -
            a.probability
        );

        const best =
            predictions[0];

        const confidence =
            Math.round(
                best.probability * 100
            );

        if (
            best.className ===
            TARGET_NAME &&
            confidence >=
            REQUIRED_CONFIDENCE
        ) {

            stableFrames++;

        }

        else {

            stableFrames = 0;

        }

        stableFrames =
            Math.min(
                stableFrames,
                REQUIRED_FRAMES
            );

        ai.textContent =
            best.className;

        confidenceText.textContent =
            confidence + "%";

        stabilityText.textContent =
            stableFrames +
            " / " +
            REQUIRED_FRAMES;

        confidenceBar.style.width =
            confidence + "%";

        stabilityBar.style.width =
            (
                stableFrames /
                REQUIRED_FRAMES *
                100
            ) + "%";


        if (
            stableFrames >=
            REQUIRED_FRAMES
        ) {

            targetConfirmed =
                true;

            targetStatus.textContent =
                "TARGET RECOGNIZED";

            if (
                !lastTargetConfirmed
            ) {

                jarvisSpeak(
                    "Target recognized. Stability confirmed."
                );

            }

        }

        else {

            targetConfirmed =
                false;

            targetStatus.textContent =
                "SEARCHING...";

            if (
                lastTargetConfirmed
            ) {

                jarvisSpeak(
                    "Target is no longer confirmed."
                );
            }
        }

        lastTargetConfirmed =
            targetConfirmed;

    }

    catch(error) {

        console.log(error);

    }

    requestAnimationFrame(
        predict
    );
}


/* ==========================================
   VOICE COMMANDS
========================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        true;

    recognition.interimResults =
        false;

    recognition.onstart =
        function() {

            listening = true;

            voiceButton.textContent =
                "🎙 JARVIS ON";

            jarvisMessage.textContent =
                "Listening. I'm ready.";
        };


    recognition.onend =
        function() {

            if (
                listening &&
                !recognitionPausedForSpeech
            ) {

                try {
                    recognition.start();
                }

                catch(error) {
                    console.log(error);
                }
            }
        };


    recognition.onresult =
        function(event) {

            const result =
                event.results[
                    event.results.length - 1
                ];

            if (!result.isFinal) {
                return;
            }

            let command =
                result[0]
                .transcript
                .toLowerCase()
                .trim();

            console.log(
                "JARVIS HEARD:",
                command
            );

            if (
                !command.includes("jarvis")
            ) {
                return;
            }

            command =
                command
                .replace(
                    /\bjarvis\b/g,
                    ""
                )
                .trim();


            if (!command) {

                jarvisSpeak(
                    "Yes?"
                );

                return;
            }


            /* STATUS */

            if (
                command.includes("status") ||
                command.includes("system report")
            ) {

                jarvisSpeak(
                    "System report. Camera online. Vision system active. Stability is " +
                    stableFrames +
                    " out of " +
                    REQUIRED_FRAMES +
                    "."
                );

                return;
            }


            /* IDENTIFY */

            if (
                command.includes("identify") ||
                command.includes("target")
            ) {

                if (targetConfirmed) {

                    jarvisSpeak(
                        "Target recognized. Confidence is " +
                        confidenceText.textContent +
                        "."
                    );

                }

                else {

                    jarvisSpeak(
                        "No confirmed target detected."
                    );
                }

                return;
            }


            /* SCAN */

            if (
                command.includes("scan") ||
                command.includes("search")
            ) {

                jarvisSpeak(
                    "Vision scan is active."
                );

                return;
            }


            /* LOCK */

            if (
                command.includes("lock on") ||
                command.includes("lock onto")
            ) {

                if (targetConfirmed) {

                    jarvisSpeak(
                        "Target confirmed. Tracking remains active."
                    );

                }

                else {

                    jarvisSpeak(
                        "I don't have a confirmed target."
                    );
                }

                return;
            }


            /* HELLO */

            if (
                command.includes("hello") ||
                command.includes("hi") ||
                command.includes("hey")
            ) {

                jarvisSpeak(
                    "Good to hear from you. Systems are standing by."
                );

                return;
            }


            /* HOW ARE YOU */

            if (
                command.includes("how are you")
            ) {

                jarvisSpeak(
                    "I'm operating normally. All primary systems are online."
                );

                return;
            }


            /* WHO ARE YOU */

            if (
                command.includes("who are you") ||
                command.includes("what are you")
            ) {

                jarvisSpeak(
                    "I'm your JARVIS-style voice assistant. I'm connected to your vision system and voice controls."
                );

                return;
            }


            /* READY */

            if (
                command.includes("ready")
            ) {

                jarvisSpeak(
                    "Ready and standing by."
                );

                return;
            }


            /* MUTE */

            if (
                command.includes("mute") ||
                command.includes("stop talking") ||
                command.includes("be quiet")
            ) {

                speechSynthesis.cancel();

                jarvisMessage.textContent =
                    "Voice output muted.";

                return;
            }


            /* HELP */

            if (
                command.includes("help") ||
                command.includes("commands")
            ) {

                jarvisSpeak(
                    "Available commands include status, identify target, scan, lock onto the target, mute, and help."
                );

                return;
            }


            /* NORMAL CONVERSATION */

            jarvisSpeak(
                "I'm listening. Try asking for my status, asking me to identify the target, or say help for my commands."
            );
        };
}


/* ==========================================
   JARVIS ON / OFF
========================================== */

voiceButton.onclick =
function() {

    primeSpeech();

    if (!recognition) {

        jarvisSpeak(
            "Voice recognition is not supported by this browser."
        );

        return;
    }


    if (!listening) {

        try {

            recognition.start();

        }

        catch(error) {

            console.log(error);

        }

    }

    else {

        listening =
            false;

        recognition.stop();

        voiceButton.textContent =
            "🎙 JARVIS OFF";

        jarvisMessage.textContent =
            "Voice system offline.";
    }
};

</script>

</body>
</html>
